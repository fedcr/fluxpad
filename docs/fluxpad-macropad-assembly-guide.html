<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluxPad Macropad - Assembly guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* FluxPad theme switch. Light is the default; the choice is remembered in localStorage.
   Loaded synchronously in <head> so the theme is set before the first paint. */
(function () {
    var KEY = 'fluxpad-theme';
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) { /* storage unavailable: keep default */ }
    var theme = saved === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);

    function syncButtons(t) {
        document.querySelectorAll('[data-theme-option]').forEach(function (btn) {
            var on = btn.getAttribute('data-theme-option') === t;
            btn.setAttribute('aria-checked', on ? 'true' : 'false');
            btn.classList.toggle('is-on', on);
        });
    }

    window.setTheme = function (t) {
        t = t === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem(KEY, t); } catch (e) { /* ignore */ }
        syncButtons(t);
    };

    document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-theme-option]');
        if (btn) window.setTheme(btn.getAttribute('data-theme-option'));
    });

    document.addEventListener('DOMContentLoaded', function () {
        syncButtons(document.documentElement.getAttribute('data-theme'));
    });
})();

</script>
<style>
/* ==========================================================================
   FluxPad assembly guide - same design language as the FluxPad Configurator:
   white / grey / blue / navy, flat surfaces, 1px borders, light theme by
   default with a navy dark variant, short purposeful motion.
   ========================================================================== */
:root,
html[data-theme="light"] {
    --main-background: #ffffff;
    --panels-background: #dbe3ee;
    --canvas: #eef1f6;
    --card-bg: #ffffff;
    --button-background: #e8eaed;
    --key-edge: #c5cce0;
    --text-color: #151844;
    --secondary-text: #1e215a;
    --muted-text: #5b6488;
    --border-color: #d6dce8;
    --border-strong: #b7c0d4;
    --primary-blue: #3B82F6;
    --light-blue: #d3e3fd;
    --hover-blue: #1c2055;
    --light-shadow: 0 1px 2px rgba(21, 24, 68, 0.08);
    --strong-shadow: 0 18px 40px -24px rgba(21, 24, 68, 0.35), 0 2px 6px rgba(21, 24, 68, 0.06);
    --focus-ring: 0 0 0 3px rgba(59, 130, 246, 0.28);
    --footer-bg: rgba(255, 255, 255, 0.94);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --footer-h: 60px;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --red: #e5484d; --green: #16a34a;
    /* board drawing */
    --bd-board: #f3f6fb; --bd-edge: #8d98b8; --bd-trk: #dde3f0; --bd-silk: #8a94b8;
    --bd-body-edge: #b7c0d4; --bd-pad: #cfd6e8; --bd-pad-edge: #8d98b8; --bd-hole: #ffffff;
}
html[data-theme="dark"] {
    --main-background: #0d1131;
    --panels-background: #151a40;
    --canvas: #090c24;
    --card-bg: #121838;
    --button-background: #1d2552;
    --key-edge: #070a1f;
    --text-color: #e8ebf7;
    --secondary-text: #c4cae8;
    --muted-text: #8790bb;
    --border-color: #29316a;
    --border-strong: #3c4685;
    --light-blue: #1d3a6e;
    --hover-blue: #9fb4ff;
    --light-shadow: none;
    --strong-shadow: 0 22px 50px -24px rgba(0, 0, 0, 0.75);
    --focus-ring: 0 0 0 3px rgba(96, 150, 255, 0.35);
    --footer-bg: rgba(13, 17, 49, 0.94);
    --bd-board: #0f1438; --bd-edge: #3c4685; --bd-trk: #1c2452; --bd-silk: #5f6aa3;
    --bd-body-edge: #29316a; --bd-pad: #343e7a; --bd-pad-edge: #5a649a; --bd-hole: #0d1131;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: var(--font); color: var(--text-color); background: var(--canvas);
    margin: 0; overflow: hidden; -webkit-font-smoothing: antialiased;
    transition: background-color .3s;
}
button { font-family: inherit; }

.main-container { display: flex; width: 100%; height: calc(100vh - var(--footer-h)); }

/* ---------- LEFT: stage ---------- */
.left-panel {
    flex: 0 0 60%; min-width: 0; position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 88px 32px 26px; overflow: hidden;
    background: color-mix(in srgb, var(--primary-blue) 9%, var(--panels-background));
    border-right: 1px solid var(--border-color);
}
.top-left-branding { position: absolute; top: 22px; left: 24px; display: flex; align-items: center; gap: 20px; z-index: 10; }
.brand-mark { display: block; line-height: 0; transition: transform .2s var(--ease), opacity .2s; }
.brand-mark:hover { transform: translateY(-2px); opacity: .85; }
.brand-mark:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 8px; }
.mark {
    display: block; background-color: var(--primary-blue);
    -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: left center;
    mask-size: contain; mask-repeat: no-repeat; mask-position: left center;
}
.mark-everythink { width: 52px; height: 52px; }
.mark-pcbway { width: 92px; height: 28px; }

.stage { width: 100%; max-width: 680px; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }

.device {
    position: relative; width: 100%; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--main-background); border: 1px solid var(--border-color);
    border-radius: 24px; box-shadow: var(--strong-shadow);
    animation: rise .6s var(--ease) both;
}
.device::after {
    content: ""; position: absolute; inset: -7px; border-radius: 30px; pointer-events: none;
    border: 1px solid color-mix(in srgb, var(--primary-blue) 45%, transparent);
    animation: breathe 4.2s ease-in-out infinite;
}
.board-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.seg { display: inline-flex; padding: 3px; background: var(--button-background); border: 1px solid var(--border-color); border-radius: 999px; }
.seg button {
    border: none; background: transparent; color: var(--muted-text);
    font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    transition: background-color .2s, color .2s;
}
.seg button.is-on { background: var(--main-background); color: var(--text-color); box-shadow: var(--light-shadow); }
.seg button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: var(--button-background); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    color: var(--primary-blue); transition: border-color .2s, transform .2s var(--ease);
}
.icon-btn:hover { border-color: var(--primary-blue); transform: scale(1.05); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

#pcb-svg { flex: 1; min-height: 0; width: 100%; cursor: grab; touch-action: none; display: block; }
#pcb-svg.dragging { cursor: grabbing; }

.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 0 18px 14px; font-size: 12px; font-weight: 500; color: var(--muted-text); min-height: 34px; }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--primary-blue); background: var(--light-blue); }
.lg i.done { border-color: var(--green); background: color-mix(in srgb, var(--green) 25%, var(--main-background)); }
.lg i.pin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #fff; background: var(--red); box-shadow: 0 0 0 1px var(--red); }
.lg svg { width: 22px; height: 14px; }
.view-note { position: absolute; left: 18px; bottom: 44px; font-size: 11px; color: var(--muted-text); pointer-events: none; }

.led-under {
    width: 72%; height: 5px; margin-top: 4px; border-radius: 999px; flex-shrink: 0;
    background: var(--primary-blue);
    box-shadow: 0 0 14px 2px color-mix(in srgb, var(--primary-blue) 70%, transparent), 0 10px 36px 4px color-mix(in srgb, var(--primary-blue) 40%, transparent);
    animation: ledBreath 3.6s ease-in-out infinite; pointer-events: none;
}

/* ---------- RIGHT: guide ---------- */
.right-panel {
    flex: 1 1 0; min-width: 0; position: relative; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 44px 0; background: var(--main-background);
}
.col { width: 100%; max-width: 380px; }
.panel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; padding-right: 56px; animation: rise .5s var(--ease) both; }
.wordmark { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--text-color); }
.product-tag { font-size: 13px; font-weight: 600; color: var(--muted-text); }

.pagination { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.dot { height: 8px; width: 8px; border: none; padding: 0; border-radius: 999px; background: var(--secondary-text); opacity: .3; cursor: pointer; transition: width .35s var(--ease), opacity .2s, background-color .3s; }
.dot:hover { opacity: .7; }
.dot.done { background: var(--green); opacity: .9; }
.dot.active { width: 22px; background: var(--primary-blue); opacity: 1; }
.dot:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.step { animation: rise .45s var(--ease) both; padding-bottom: 24px; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-text); margin-bottom: 6px; }
.step-title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
.step-sub { font-size: 14px; color: var(--muted-text); margin: 0 0 18px; }
.block { margin-bottom: 18px; }
.block-label { display: block; margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-text); }

.part-row {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer; color: var(--text-color);
    background: var(--main-background); border: 1px solid var(--border-color); border-radius: var(--radius-md);
    transition: border-color .2s, background-color .2s, transform .15s var(--ease);
}
.part-row:hover { border-color: var(--primary-blue); transform: translateY(-1px); }
.part-row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.part-row.is-on { background: var(--light-blue); border-color: var(--primary-blue); }
.part-row .val { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.part-row .qty { font-size: 13px; font-weight: 700; color: var(--primary-blue); align-self: center; font-variant-numeric: tabular-nums; }
.part-row .note { grid-column: 1 / -1; font-size: 12px; color: var(--muted-text); }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip {
    padding: 3px 8px; border-radius: 6px; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--button-background); color: var(--text-color); border: 1px solid var(--border-color);
    cursor: pointer; transition: border-color .2s, color .2s;
}
.chip:hover, .chip.is-on { border-color: var(--primary-blue); color: var(--primary-blue); }

.orient { display: flex; gap: 14px; align-items: center; padding: 12px 14px; background: var(--canvas); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
.orient-ico { width: 56px; height: 56px; flex-shrink: 0; border-radius: var(--radius-md); background: var(--main-background); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
.orient-ico svg { width: 46px; height: 46px; }
.orient-txt strong { display: block; font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.orient-txt span { font-size: 13px; line-height: 1.45; color: var(--secondary-text); }
.ic-body { fill: var(--panels-background); stroke: var(--text-color); stroke-width: 1.6; }
.ic-pad { fill: var(--primary-blue); }
.ic-line { fill: none; stroke: var(--text-color); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic-fill { fill: var(--text-color); }
.ic-red { fill: var(--red); stroke: #fff; stroke-width: 1; }
.ic-txt { font: 800 9px var(--font); fill: var(--text-color); }
.dirs { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.dir-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.dir-tag { font-size: 12px; font-weight: 700; color: var(--text-color); min-width: 118px; }
.dir-tag b { color: var(--primary-blue); font-size: 15px; margin-right: 4px; }

.how { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.how li { counter-increment: s; position: relative; padding: 0 0 10px 34px; font-size: 14px; line-height: 1.5; color: var(--secondary-text); }
.how li::before {
    content: counter(s); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--light-blue); color: var(--primary-blue); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; }
.pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--button-background); border: 1px solid var(--border-color); color: var(--text-color); }
.callout { display: flex; gap: 10px; padding: 12px 14px; margin-bottom: 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.5; }
.callout b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.callout.warn { background: color-mix(in srgb, var(--red) 9%, var(--main-background)); border: 1px solid color-mix(in srgb, var(--red) 35%, var(--border-color)); border-left: 3px solid var(--red); }
.callout.warn b { color: var(--red); }
.callout.info { background: var(--light-blue); border: 1px solid color-mix(in srgb, var(--primary-blue) 30%, var(--border-color)); border-left: 3px solid var(--primary-blue); }
.callout.info b { color: var(--primary-blue); }
.callout button { margin-top: 8px; }

.actions { position: sticky; bottom: 0; width: calc(100% + 88px); margin-top: auto; background: var(--main-background); border-top: 1px solid var(--border-color); padding: 14px 44px 16px; display: flex; justify-content: center; z-index: 5; }
.actions .col { display: flex; gap: 10px; }
.primary-button {
    flex: 1; padding: 13px 16px; background: var(--primary-blue); color: #fff; border: none; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; box-shadow: var(--light-shadow);
    transition: transform .15s var(--ease), filter .2s;
}
.primary-button:hover { filter: brightness(1.07); transform: translateY(-1px); }
.primary-button:active { transform: translateY(1px) scale(.99); }
.primary-button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.secondary-button {
    padding: 13px 16px; background: var(--button-background); color: var(--text-color); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: border-color .2s, transform .15s var(--ease);
}
.secondary-button:hover { border-color: var(--primary-blue); transform: translateY(-1px); }
.secondary-button:disabled { opacity: .45; cursor: not-allowed; transform: none; border-color: var(--border-color); }
.secondary-button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.callout .secondary-button { padding: 8px 12px; font-size: 11px; }

.finish h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
.finish p { color: var(--muted-text); font-size: 14px; margin: 0 0 16px; }

/* settings gear + panel */
.settings-fab {
    position: absolute; top: 26px; right: 26px; width: 46px; height: 46px; border: none; border-radius: 50%;
    background: var(--primary-blue); color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer;
    box-shadow: var(--strong-shadow); transition: transform .2s var(--ease); z-index: 1000;
}
.settings-fab:hover { transform: scale(1.06); }
.settings-fab:active { transform: scale(.96); }
.settings-fab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.settings-panel {
    position: absolute; top: 84px; right: 22px; width: 280px; z-index: 999; display: none; flex-direction: column; gap: 6px;
    background: var(--main-background); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
    padding: 12px 10px; box-shadow: var(--strong-shadow); animation: rise .3s var(--ease) both;
}
.settings-panel.open { display: flex; }
.menu-title { padding: 6px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-text); }
.theme-switch { display: inline-flex; padding: 3px; margin: 0 8px 4px; align-self: flex-start; background: var(--button-background); border: 1px solid var(--border-color); border-radius: 999px; }
.theme-switch button { border: none; background: transparent; color: var(--muted-text); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: background-color .2s, color .2s; }
.theme-switch button.is-on { background: var(--main-background); color: var(--text-color); box-shadow: var(--light-shadow); }
.menu-divider { width: 100%; border: none; border-top: 1px solid var(--border-color); margin: 4px 0; }
.menu-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--text-color); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; text-decoration: none; transition: background-color .15s; }
.menu-link:hover { background: var(--button-background); }
.menu-link svg { color: var(--primary-blue); flex-shrink: 0; }

/* modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(13, 17, 49, .45); display: none; justify-content: center; align-items: center; z-index: 9999; animation: fadeIn .2s ease both; }
.modal-overlay.open { display: flex; }
.modal-card { background: var(--main-background); padding: 26px 28px; border-radius: var(--radius-lg); width: 92%; max-width: 560px; max-height: 86vh; overflow-y: auto; border: 1px solid var(--border-color); box-shadow: var(--strong-shadow); animation: rise .3s var(--ease) both; }
.modal-card h3 { margin: 0 0 14px; font-size: 18px; font-weight: 800; }
.bom { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
.bom th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-text); padding: 6px 6px; border-bottom: 1px solid var(--border-color); }
.bom td { padding: 8px 6px; border-bottom: 1px solid var(--border-color); vertical-align: top; }
.bom td.r { font: 700 12px ui-monospace, Menlo, monospace; color: var(--primary-blue); }
.bom td.f { font: 11px ui-monospace, Menlo, monospace; color: var(--muted-text); word-break: break-all; }
.bom td.q { text-align: right; font-weight: 700; }

/* tooltip (same look as the configurator's help bubbles) */
.tt { position: fixed; z-index: 2000; pointer-events: none; display: none; max-width: 240px; background: var(--text-color); color: var(--main-background); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; line-height: 1.45; box-shadow: var(--strong-shadow); }
.tt b { font-size: 14px; }
.tt span { display: block; opacity: .85; }

/* footer */
.app-footer { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-h); background: var(--footer-bg); border-top: 1px solid var(--border-color); padding: 0 24px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; z-index: 1000; }
.footer-left { color: var(--muted-text); font-weight: 500; }
.footer-right { display: flex; align-items: center; gap: 12px; }
.feedback-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--button-background); color: var(--text-color); text-decoration: none; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color .2s, transform .15s var(--ease); }
.feedback-btn:hover { border-color: var(--primary-blue); transform: translateY(-1px); }
.support-btn, .support-btn:hover { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff !important; }

/* ---------- board drawing ---------- */
.board { fill: var(--bd-board); stroke: var(--bd-edge); stroke-width: .3; }
.trk { fill: none; stroke: var(--bd-trk); stroke-linecap: round; }
.via { fill: var(--bd-trk); }
.silk { fill: none; stroke: var(--bd-silk); stroke-width: .12; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.silk-f { fill: var(--bd-silk); opacity: .32; }
.hole { fill: var(--bd-hole); stroke: var(--bd-edge); stroke-width: .15; }
.pth { fill: var(--bd-hole); }
.cap-txt { font: 600 1.6px var(--font); fill: var(--muted-text); text-anchor: middle; }
.pcb-comp { cursor: pointer; }
.hit { fill: transparent; }
.c-body { fill: transparent; stroke: var(--bd-body-edge); stroke-width: .12; transition: fill .2s, stroke .2s; }
.c-pad { fill: var(--bd-pad); stroke: var(--bd-pad-edge); stroke-width: .05; transition: fill .2s; }
.c-ant { fill: none; stroke: var(--muted-text); stroke-width: .14; stroke-dasharray: .8 .6; }
.c-ant-lbl { font: 700 1.2px var(--font); fill: var(--muted-text); text-anchor: middle; letter-spacing: .08px; }
.c-glyph, .c-pin1 { display: none; }
.pcb-comp:hover .c-body { stroke: var(--primary-blue); stroke-width: .22; }

.pcb-comp.hi .c-body { fill: var(--light-blue); stroke: var(--primary-blue); stroke-width: .3; }
.pcb-comp.hi .c-pad { fill: var(--primary-blue); stroke: var(--primary-blue); }
.pcb-comp.hi .c-pad.p1 { fill: var(--red); stroke: var(--red); }
.pcb-comp.hi .c-glyph { display: block; }
.pcb-comp.hi .c-pin1 { display: block; fill: var(--red); stroke: #fff; stroke-width: .12; }
.pcb-comp.hi .c-ant { stroke: var(--primary-blue); }
.pcb-comp.hi .c-ant-lbl { fill: var(--primary-blue); }
.pcb-comp.hi-soft .c-body { stroke: var(--primary-blue); stroke-width: .2; stroke-dasharray: .6 .4; }
.pcb-comp.hi-soft .c-pad { fill: color-mix(in srgb, var(--primary-blue) 45%, var(--bd-pad)); }
.pcb-comp.done .c-body { fill: color-mix(in srgb, var(--green) 14%, transparent); stroke: var(--green); stroke-width: .2; }
.pcb-comp.done .c-pad { fill: color-mix(in srgb, var(--green) 70%, var(--bd-pad)); stroke: var(--green); }
.pcb-comp.dim { opacity: .45; }
.g-tri { fill: var(--text-color); }
.g-bar { stroke: var(--text-color); stroke-width: .3; stroke-linecap: round; }
.lab-bg { fill: var(--main-background); stroke: var(--primary-blue); stroke-width: .15; }
.lab-txt { font: 500 1.45px var(--font); fill: var(--text-color); }
.lab-ref { font-weight: 800; }
.lab-val { fill: var(--primary-blue); font-weight: 700; }
.lab-line { stroke: var(--primary-blue); stroke-width: .12; }
.lab { pointer-events: none; }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
@keyframes ledBreath { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

@media (max-width: 900px) {
    body { overflow: auto; }
    .main-container { flex-direction: column; height: auto; min-height: calc(100vh - var(--footer-h)); }
    .left-panel { flex: none; height: 78vh; border-right: none; }
    .right-panel { flex: none; overflow: visible; padding: 28px 20px 0; }
    .actions { width: calc(100% + 40px); padding: 14px 20px 16px; }
    .app-footer { position: sticky; }
}
@media (max-width: 560px) { .footer-left { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

            placed.forEach(p => { sc += overlap(r, p) * 100; });
            bodies.forEach(o => { if (o.ref !== ref) sc += overlap(r, { x0: o.b.x0 - .2, y0: o.b.y0 - .2, x1: o.b.x1 + .2, y1: o.b.y1 + .2 }) * 40; });
            const out = Math.max(0, -r.x0) + Math.max(0, r.x1 - BW) + Math.max(0, -r.y0) + Math.max(0, r.y1 - BH);
            sc += out * 500;
            if (!best || sc < best.sc) best = { sc, r };
        });
        placed.push(best.r); labelRects.push(best.r);
        const r = best.r;
        html += `<g class="lab"><line class="lab-line" x1="${f(r.x0 + w / 2)}" y1="${f(r.y0 + h / 2)}" x2="${f(cx)}" y2="${f(cy)}"/><rect class="lab-bg" x="${f(r.x0)}" y="${f(r.y0)}" width="${f(w)}" height="${f(h)}" rx="1.1"/>` +
                `<text class="lab-txt" x="${f(r.x0 + .75)}" y="${f(r.y0 + h * 0.69)}"><tspan class="lab-ref">${ref}</tspan>` +
                (val ? `<tspan class="lab-val" dx=".6">${val}</tspan>` : '') + `</text></g>`;
    });
    g.innerHTML = html;
}

/* ---------- view / zoom ---------- */
let vb = { x: 0, y: 0, w: BW, h: BH }, anim = null;
function setVB(v) { vb = v; svg.setAttribute('viewBox', `${f(v.x)} ${f(v.y)} ${f(v.w)} ${f(v.h)}`); }
function fitView(b, pad, minW) {
    const r = svg.getBoundingClientRect(), ar = (r.width || 800) / (r.height || 600);
    let w = (b.x1 - b.x0) + 2 * pad, h = (b.y1 - b.y0) + 2 * pad;
    if (w < minW) w = minW;
    if (w / h < ar) w = h * ar; else h = w / ar;
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    let x = cx - w / 2, y = cy - h / 2;
    const minX = -3, maxX = BW + 3, minY = -3, maxY = BH + 7;
    if (w <= maxX - minX) x = Math.min(Math.max(x, minX), maxX - w);
    if (h <= maxY - minY) y = Math.min(Math.max(y, minY), maxY - h);
    return { x, y, w, h };
}
function targetBox() {
    if (S.fitAll || S.i >= N) return null;
    const refs = S.focus || stepRefs(S.i);
    const boxes = refs.map(r => shapeOf(r, S.layer)).filter(Boolean).map(sh => boxS(sh.body, S.layer));
    if (!boxes.length) return null;
    const all = boxes.concat(labelRects);
    return { x0: Math.min(...all.map(b => b.x0)), y0: Math.min(...all.map(b => b.y0)), x1: Math.max(...all.map(b => b.x1)), y1: Math.max(...all.map(b => b.y1)) };
}
function applyView(instant) {
    const b = targetBox();
    const v = b ? fitView(b, 3, 30) : fitView({ x0: -2, y0: -2, x1: BW + 2, y1: BH + 6 }, 0, 0);
    if (anim) cancelAnimationFrame(anim);
    if (instant) { setVB(v); return; }
    const a = { ...vb }, t0 = performance.now(), D = 380;
    const tick = now => {
        const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
        setVB({ x: a.x + (v.x - a.x) * e, y: a.y + (v.y - a.y) * e, w: a.w + (v.w - a.w) * e, h: a.h + (v.h - a.h) * e });
        if (k < 1) anim = requestAnimationFrame(tick);
    };
    anim = requestAnimationFrame(tick);
}
let drag = null, dragged = false;
svg.addEventListener('wheel', e => {
    e.preventDefault(); if (anim) cancelAnimationFrame(anim);
    const r = svg.getBoundingClientRect();
    const px = vb.x + (e.clientX - r.left) / r.width * vb.w, py = vb.y + (e.clientY - r.top) / r.height * vb.h;
    let k = e.deltaY < 0 ? 0.85 : 1 / 0.85; k = Math.max(Math.min(k, 3 * BW / vb.w), 8 / vb.w);
    setVB({ x: px - (px - vb.x) * k, y: py - (py - vb.y) * k, w: vb.w * k, h: vb.h * k });
}, { passive: false });
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, moved: false }; });
window.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) { drag.moved = true; svg.classList.add('dragging'); hideTT(); if (anim) cancelAnimationFrame(anim); }
    const r = svg.getBoundingClientRect();
    setVB({ x: drag.vx - dx / r.width * vb.w, y: drag.vy - dy / r.height * vb.h, w: vb.w, h: vb.h });
});
window.addEventListener('pointerup', () => {
    if (drag && drag.moved) { dragged = true; setTimeout(() => { dragged = false; }, 0); }
    svg.classList.remove('dragging'); drag = null;
});
if (window.ResizeObserver) new ResizeObserver(() => applyView(true)).observe(svg);
window.addEventListener('resize', () => applyView(true));

/* ---------- tooltip ---------- */
const tt = $('tt');
function orientText(ref) {
    const c = COMP[ref];
    if (c && c.cathode) { const d = dirInfo(c.cathode.vec); return `Cathode (band) ${d.a} ${d.w}`; }
    const g = groupOf(ref), s = g ? STEPS[REF[ref].step] : null;
    return s && s.orient ? s.orient.short || '' : '';
}
function showTT(e, ref) {
    const g = groupOf(ref); if (!g) return;
    const o = orientText(ref);
    tt.innerHTML = `<b>${ref}</b>${tagOf(ref) ? ' &middot; ' + tagOf(ref) : (g.label ? ' &middot; ' + g.label : '')}` + (o ? `<span>${o}</span>` : '');
    tt.style.display = 'block'; moveTT(e);
}
function moveTT(e) {
    const w = tt.offsetWidth || 200, h = tt.offsetHeight || 50;
    let x = e.clientX + 14, y = e.clientY - h - 10;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y < 8) y = e.clientY + 18;
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function hideTT() { tt.style.display = 'none'; }
svg.addEventListener('mouseover', e => { const el = e.target.closest('.pcb-comp'); if (el && !(drag && drag.moved)) showTT(e, el.dataset.ref); });
svg.addEventListener('mousemove', e => { if (tt.style.display === 'block') moveTT(e); });
svg.addEventListener('mouseout', e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.pcb-comp')) hideTT(); });
svg.addEventListener('click', e => {
    if (dragged) return;
    const el = e.target.closest('.pcb-comp'); if (!el) return;
    const r = REF[el.dataset.ref]; if (!r) return;
    go(r.step, [el.dataset.ref]);
});

/* ---------- orientation icons ---------- */
const ICON = {
    none: '<svg viewBox="0 0 56 56"><rect x="15" y="23" width="26" height="10" rx="2.5" class="ic-body"/><rect x="11" y="23" width="6" height="10" rx="1.5" class="ic-pad"/><rect x="39" y="23" width="6" height="10" rx="1.5" class="ic-pad"/><path d="M19 13h18M23 9l-4 4 4 4M33 9l4 4-4 4" class="ic-line"/><path d="M19 43h18M23 39l-4 4 4 4M33 39l4 4-4 4" class="ic-line"/></svg>',
    diode: '<svg viewBox="0 0 56 56"><rect x="9" y="21" width="38" height="14" rx="3" class="ic-body"/><rect x="5" y="21" width="7" height="14" rx="1.5" class="ic-pad"/><rect x="44" y="21" width="7" height="14" rx="1.5" class="ic-pad"/><path d="M20 28l11-7v14z" class="ic-fill"/><path d="M34 20v16" class="ic-line"/><text x="31" y="49" class="ic-txt">K</text></svg>',
    pin1: '<svg viewBox="0 0 56 56"><rect x="15" y="15" width="26" height="26" rx="3" class="ic-body"/><path d="M10 21h5M10 28h5M10 35h5M41 21h5M41 28h5M41 35h5M21 10v5M28 10v5M35 10v5M21 41v5M28 41v5M35 41v5" class="ic-line"/><circle cx="21" cy="21" r="3.4" class="ic-red"/></svg>',
    key: '<svg viewBox="0 0 56 56"><path d="M12 14h12a4 4 0 0 0 8 0h12v28H12z" class="ic-body"/><path d="M28 24v12M23 31l5 5 5-5" class="ic-line"/></svg>',
    edge: '<svg viewBox="0 0 56 56"><rect x="10" y="30" width="36" height="14" rx="2" class="ic-body"/><rect x="19" y="22" width="18" height="10" rx="2" class="ic-pad"/><path d="M28 17V7M23 12l5-5 5 5" class="ic-line"/></svg>'
};

/* ---------- right panel ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function chips(refs, withArrow) {
    return refs.map(r => {
        const c = COMP[r], on = S.focus && S.focus.length === 1 && S.focus[0] === r;
        const a = withArrow && c && c.cathode ? ' ' + dirInfo(c.cathode.vec).a : '';
        return `<button type="button" class="chip${on ? ' is-on' : ''}" data-chip="${r}">${r}${a}</button>`;
    }).join('');
}
function orientHTML(s) {
    const o = s.orient || { kind: 'none', title: 'No polarity', text: 'Either way round.' };
    let h = `<div class="block"><span class="block-label">Orientation</span><div class="orient"><div class="orient-ico">${ICON[o.kind] || ICON.none}</div>` +
            `<div class="orient-txt"><strong>${o.title}</strong><span>${o.text}</span></div></div>`;
    if (o.kind === 'diode') {
        const by = {};
        stepRefs(S.i).forEach(r => { const c = COMP[r]; if (c && c.cathode) { const d = dirInfo(c.cathode.vec); (by[d.w] = by[d.w] || { d, refs: [] }).refs.push(r); } });
        h += '<div class="dirs">' + Object.keys(by).map(k => `<div class="dir-row"><span class="dir-tag"><b>${by[k].d.a}</b>Cathode ${k}</span>${chips(by[k].refs, false)}</div>`).join('') + '</div>';
    }
    return h + '</div>';
}
function renderStep() {
    const el = $('step');
    if (S.i >= N) {
        el.innerHTML = `<div class="step finish"><div class="kicker">All steps done</div><h2>Assembly complete</h2><p>Before the first power-up, run these quick checks.</p>` +
            `<ol class="how">${CFG.finish.map(t => `<li>${t}</li>`).join('')}</ol></div>`;
        return;
    }
    const s = STEPS[S.i];
    const groups = s.groups.map((g, gi) => {
        const on = S.focus && g.refs.length === S.focus.length && g.refs.every(r => S.focus.includes(r));
        return `<div class="part-row${on ? ' is-on' : ''}" role="button" tabindex="0" data-g="${gi}">` +
            `<span class="val">${g.label}</span><span class="qty">\u00d7 ${g.refs.length}</span>` +
            (g.note ? `<span class="note">${g.note}</span>` : '') +
            (g.nochips ? '' : `<span class="chips">${chips(g.refs, false)}</span>`) + `</div>`;
    }).join('');
    const pills = (s.pills || []).map(t => `<span class="pill">${t}</span>`).join('');
    el.innerHTML = `<div class="step" key="${S.i}">` +
        `<div class="kicker">Step ${S.i + 1} of ${N} &middot; ${s.layer === 'bottom' ? 'Bottom side' : 'Top side'}</div>` +
        `<h2 class="step-title">${s.title}</h2><p class="step-sub">${s.sub}</p>` +
        `<div class="block"><span class="block-label">Place these \u2014 tap one to find it</span>${groups}</div>` +
        orientHTML(s) +
        (s.warn ? `<div class="callout warn"><div><b>Watch out</b>${s.warn}</div></div>` : '') +
        (s.also ? `<div class="callout info"><div><b>Both sides</b>${s.also}<br><button type="button" class="secondary-button" data-layer="${s.layer === 'bottom' ? 'top' : 'bottom'}">Show ${s.layer === 'bottom' ? 'top' : 'bottom'} side</button></div></div>` : '') +
        `<div class="block"><span class="block-label">How</span><ol class="how">${s.how.map(t => `<li>${t}</li>`).join('')}</ol>${pills ? `<div class="pills">${pills}</div>` : ''}</div>` +
        `</div>`;
}
function renderPager() {
    $('pager').innerHTML = STEPS.map((s, i) => `<button type="button" class="dot${i === S.i ? ' active' : ''}${S.done.has(i) ? ' done' : ''}" data-dot="${i}" role="tab" aria-label="Step ${i + 1}: ${esc(s.title)}" title="${i + 1}. ${esc(s.title)}"></button>`).join('');
}
function renderActions() {
    const a = $('actions');
    if (S.i >= N) {
        a.innerHTML = `<button type="button" class="secondary-button" data-act="back">Back to steps</button><button type="button" class="primary-button" data-act="reset">Start over</button>`;
    } else {
        a.innerHTML = `<button type="button" class="secondary-button" data-act="back"${S.i === 0 ? ' disabled' : ''}>Back</button>` +
            `<button type="button" class="primary-button" data-act="next">${S.i === N - 1 ? 'Finish' : 'Done \u2014 next step'}</button>`;
    }
}
function renderLegend() {
    const L = [];
    if (S.i < N && S.layer === 'top') {
        const refs = S.focus || stepRefs(S.i);
        L.push('<span class="lg"><i></i>This step</span>');
        if (refs.some(r => COMP[r] && COMP[r].cathode)) L.push('<span class="lg"><svg viewBox="0 0 22 14"><path d="M3 2l10 5-10 5z" class="ic-fill"/><path d="M16 1v12" class="ic-line"/></svg>Cathode (band) end</span>');
        if (refs.some(r => COMP[r] && COMP[r].pin1)) L.push('<span class="lg"><i class="pin"></i>Pin 1</span>');
        if (S.done.size) L.push('<span class="lg"><i class="done"></i>Placed</span>');
    } else if (S.i < N) {
        L.push('<span class="lg"><i></i>This step</span>');
        if (S.done.size) L.push('<span class="lg"><i class="done"></i>Placed</span>');
    }
    $('legend').innerHTML = L.join('');
    $('view-note').textContent = S.layer === 'bottom' ? 'Bottom view is mirrored, as if you flipped the board over.' : '';
}
function renderAll() {
    const cls = classify();
    svg.querySelectorAll('.pcb-comp').forEach(el => { el.setAttribute('class', 'pcb-comp ' + cls(el.dataset.ref)); });
    $('seg-top').classList.toggle('is-on', S.layer === 'top'); $('seg-bot').classList.toggle('is-on', S.layer === 'bottom');
    $('L-top').style.display = S.layer === 'top' ? '' : 'none'; $('L-bot').style.display = S.layer === 'bottom' ? '' : 'none';
    drawLabels(); renderLegend(); renderStep(); renderPager(); renderActions();
    $('foot-left').textContent = S.i >= N ? 'All steps complete' : `Step ${S.i + 1} of ${N} \u00b7 ${S.done.size} done`;
}

/* ---------- navigation ---------- */
function go(i, focus) {
    S.i = Math.max(0, Math.min(N, i)); S.focus = focus || null; S.fitAll = false;
    S.layer = S.i < N ? STEPS[S.i].layer : 'top';
    save(); renderAll(); applyView(false);
    $('right').scrollTo({ top: 0, behavior: 'smooth' });
}
function setFocus(refs) {
    const same = S.focus && S.focus.length === refs.length && refs.every(r => S.focus.includes(r));
    S.focus = same ? null : refs; S.fitAll = false;
    renderAll(); applyView(false);
}
$('step').addEventListener('click', e => {
    const chip = e.target.closest('[data-chip]'); if (chip) { e.stopPropagation(); setFocus([chip.dataset.chip]); return; }
    const row = e.target.closest('[data-g]'); if (row) { setFocus(STEPS[S.i].groups[+row.dataset.g].refs); return; }
    const lay = e.target.closest('[data-layer]'); if (lay) App.setLayer(lay.dataset.layer);
});
$('step').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-g]')) { e.preventDefault(); setFocus(STEPS[S.i].groups[+e.target.dataset.g].refs); }
});
$('pager').addEventListener('click', e => { const d = e.target.closest('[data-dot]'); if (d) go(+d.dataset.dot); });
$('actions').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'next') { S.done.add(S.i); go(S.i + 1); }
    else if (b.dataset.act === 'back') go(S.i >= N ? N - 1 : S.i - 1);
    else if (b.dataset.act === 'reset') { S.done = new Set(); go(0); }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { App.closeBom(); $('menu').classList.remove('open'); return; }
    if (e.target.matches && e.target.matches('input,textarea,select')) return;
    if (e.key === 'ArrowRight' && S.i < N) go(S.i + 1);
    if (e.key === 'ArrowLeft' && S.i > 0) go(S.i - 1);
});
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#gear')) $('menu').classList.remove('open'); });

/* ---------- public API ---------- */
let resetArmed = null;
window.App = {
    setLayer(l) { S.layer = l; S.fitAll = false; renderAll(); applyView(false); },
    fit() { S.fitAll = true; applyView(false); },
    toggleMenu() { $('menu').classList.toggle('open'); },
    openBom() {
        $('menu').classList.remove('open');
        $('bom-card').innerHTML = `<h3>Parts list</h3><table class="bom"><thead><tr><th>Ref</th><th>Value</th><th>Footprint</th><th style="text-align:right">Qty</th></tr></thead><tbody>` +
            CFG.bom.map(b => `<tr><td class="r">${b[0]}</td><td>${b[1]}</td><td class="f">${b[2]}</td><td class="q">${b[3]}</td></tr>`).join('') + `</tbody></table>` +
            (CFG.bomNotes || []).map(n => `<div class="callout info"><div><b>Check</b>${n}</div></div>`).join('') +
            `<button type="button" class="primary-button" style="width:100%" onclick="App.closeBom()">Close</button>`;
        $('bom-modal').classList.add('open');
    },
    closeBom() { $('bom-modal').classList.remove('open'); },
    reset() {
        const btn = event && event.currentTarget;
        if (!resetArmed) {
            resetArmed = setTimeout(() => { resetArmed = null; if (btn) btn.lastChild.textContent = '\n        Start over\n      '; }, 3000);
            if (btn) btn.lastChild.textContent = '\n        Tap again to confirm\n      ';
            return;
        }
        clearTimeout(resetArmed); resetArmed = null; S.done = new Set(); $('menu').classList.remove('open'); go(0);
        if (btn) btn.lastChild.textContent = '\n        Start over\n      ';
    }
};

/* ---------- init ---------- */
load();
build();
S.layer = S.i < N ? STEPS[S.i].layer : 'top';
renderAll();
requestAnimationFrame(() => applyView(true));
})();

</script>
</body>
</html>

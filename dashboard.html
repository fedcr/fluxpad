<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxPad - Dashboard & Stats</title>
    <link rel="icon" type="image/png" href="logo fluxpad.png">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Config
        </a>
        <h1>Dashboard</h1>
        <button id="connect-btn" class="connect-btn" onclick="connectSerial()">Sync Stats</button>
    </div>

    <div class="dashboard-container">
        <!-- Hero Stats (Top Left) -->
        <div class="card hero-card">
            <div class="circular-progress">
                <div class="inner-circle">
                    <span id="stat-saved">0</span>
                    <span class="label">Min. Saved</span>
                </div>
            </div>
            <div class="hero-stats">
                <div class="stat-box green">
                    <span class="title">Total Clicks</span>
                    <span class="value" id="stat-total-clicks">0</span>
                </div>
                <div class="stat-box purple">
                    <span class="title">Uptime (Hours)</span>
                    <span class="value" id="stat-uptime">0h 0m</span>
                </div>
            </div>
        </div>

        <!-- Insights (Bottom Left) -->
        <div class="card insights-card">
            <h2>Activity Insights</h2>
            <div class="insight-row">
                <div class="insight-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="insight-text">
                    <strong>Most Used Key</strong>
                    <span id="stat-most-used">N/A</span>
                </div>
            </div>
            <div class="insight-row">
                <div class="insight-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </div>
                <div class="insight-text">
                    <strong>Efficiency (Clicks/Min)</strong>
                    <span id="stat-efficiency">0.0</span>
                </div>
            </div>
            <div class="insight-row">
                <div class="insight-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="6" y1="16" x2="18" y2="16"></line></svg>
                </div>
                <div class="insight-text">
                    <strong>Active Configuration</strong>
                    <span id="stat-shortcuts">Reading...</span>
                </div>
            </div>
        </div>

        <!-- Heatmap (Right, Full Height) -->
        <div class="card heatmap-card">
            <div class="heatmap-header">
                <h2>Keys Heatmap</h2>
                <span class="badge">Local EEPROM</span>
            </div>
            <p class="heatmap-desc">Darker colors indicate keys pressed with higher frequency.</p>
            
            <div class="heatmap-grid" id="heatmap">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
